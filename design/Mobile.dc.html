<helmet>

  <style>
    body { margin: 0; background: #0a0a09; }
    a { color: #3fe08f; text-decoration: none; }
    a:hover { color: #7cebb4; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

</helmet>

<div style="width: 390px; background: #0a0a09; color: #f5f4ee; font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; padding: 0 0 40px;">

  <div style="padding: 22px 20px 16px; border-bottom: 1px solid {{emph}}; display: flex; flex-direction: column; gap: 4px;">
    <div class="mono" style="font-size: 10px; letter-spacing: 0.22em; color: {{emph}};">AI JOBS TREND</div>
    <div style="font-size: 21px; font-weight: 900; letter-spacing: -0.015em;">次に取りに行く技術</div>
  </div>

  <div style="display: flex; gap: 1px; background: #262622; border-bottom: 1px solid #262622;">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
      <div style="flex-grow: 1; background: #141412; padding: 15px 18px; display: flex; flex-direction: column; gap: 2px;">
        <div class="mono" style="font-size: 9.5px; letter-spacing: 0.14em; color: {{t.kColor}};">{{t.k}}</div>
        <div class="mono" style="font-size: 26px; font-weight: {{t.weight}}; line-height: 1.1; color: {{t.vColor}};">{{t.v}}<span style="font-size: 11px; color: #a9a79d; margin-left: 3px;">{{t.u}}</span></div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 6px; padding: 16px 20px;">
    <div class="mono" style="font-size: 12px; padding: 13px 17px; background: {{emph}}; color: #0a0a09; font-weight: 700; white-space: nowrap;">優先度</div>
    <div class="mono" style="font-size: 12px; padding: 13px 17px; border: 1px solid #262622; color: #a9a79d; white-space: nowrap;">2軸マップ</div>
    <div class="mono" style="font-size: 12px; padding: 13px 17px; border: 1px solid #262622; color: #a9a79d; white-space: nowrap;">共起</div>
  </div>

  <div style="padding: 0 20px;">
    <div style="display: flex; flex-direction: column; gap: 1px; background: #262622; border: 1px solid #262622;">
      <sc-for list="{{rank}}" as="r" hint-placeholder-count="8">
        <div style="background: #141412; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; align-items: baseline; gap: 11px;">
            <span class="mono" style="font-size: 13px; color: {{r.rankColor}};">{{r.no}}</span>
            <span style="font-size: 15px; font-weight: {{r.weight}}; color: {{r.nameColor}};">{{r.name}}</span>
            <span class="mono" style="font-size: 15px; color: {{r.scoreColor}}; font-weight: {{r.weight}}; margin-left: auto;">{{r.score}}</span>
          </div>
          <div style="height: 8px; background: #1c1c19;">
            <div style="height: 8px; width: {{r.pct}}; background: {{r.barColor}};"></div>
          </div>
          <div style="display: flex; gap: 14px;">
            <span class="mono" style="font-size: 11px; color: #6e6c63;">{{r.volLabel}}</span>
            <span class="mono" style="font-size: 11px; color: {{r.growColor}};">成長 {{r.growth_pct}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 24px 20px 0;">
    <div class="mono" style="font-size: 10px; letter-spacing: 0.16em; color: {{emph}}; padding-bottom: 10px;">狙い目の束</div>
    <div style="background: {{emphWash}}; border: 1px solid {{emphDim}}; border-left: 3px solid {{emph}}; padding: 16px 18px; display: flex; flex-direction: column; gap: 11px;">
      <div style="font-size: 13.5px; line-height: 1.95; color: #f5f4ee;">{{bundleText}}</div>
      <div style="display: flex; flex-wrap: wrap; gap: 5px;">
        <sc-for list="{{bundle}}" as="b" hint-placeholder-count="5">
          <span class="mono" style="font-size: 11.5px; background: #1c1c19; border: 1px solid #262622; padding: 3px 9px;">{{b}}</span>
        </sc-for>
      </div>
    </div>
  </div>

</div>

      vColor: t.key ? emph : INK, kColor: t.key ? emph : MUTED }));

    const rows = rank.map((r, i) => ({
      no: String(i + 1).padStart(2, '0'),
      name: r.name, score: r.score.toFixed(2),
      growth_pct: r.growth_pct,
      volLabel: `直近${win}週 ${r.recent}件`,
      pct: Math.round((r.score / maxScore) * 100) + '%',
      weight: i < 3 ? 700 : 400,
      nameColor: i < 3 ? emph : INK,
      rankColor: i < 3 ? emph : MUTED,
      barColor: i < 3 ? emph : emphDim,
      scoreColor: i < 3 ? emph : INK,
      growColor: r.growth_pct.startsWith('-') ? '#d95926' : emph,
    }));

    const top = (D.cooc || [])[0];
    const bundleText = top
      ? `${top.name} を扱う社内PJに入れば、${top.with.slice(0, 3).map(x => x.split(' ')[0]).join('・')} が同時に付いてくる。1本で ${top.with.length + 1} 技術。`
      : '';

    return {
      emph, emphDim, emphWash,
      tiles, rank: rows,
      bundleText, bundle: top ? top.with : [],
    };
  }
}
</script>
