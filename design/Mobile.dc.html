<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0d0d0c; }
    a { color: #cdf24d; text-decoration: none; }
    a:hover { color: #e2fa8e; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; background: #0d0d0c; color: #f2f1ea; font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; padding: 0 0 40px;">

  <div style="padding: 22px 20px 16px; border-bottom: 1px solid {{accent}}; display: flex; flex-direction: column; gap: 5px;">
    <div class="mono" style="font-size: 10px; letter-spacing: 0.22em; color: {{accent}};">AI JOBS TREND</div>
    <div style="font-size: 20px; font-weight: 900;">次に取りに行く技術</div>
  </div>

  <div style="display: flex; border-bottom: 1px solid #2c2c28;">
    <div style="flex-grow: 1; padding: 15px 20px; border-right: 1px solid #2c2c28; display: flex; flex-direction: column; gap: 2px;">
      <div class="mono" style="font-size: 9.5px; letter-spacing: 0.14em; color: #6b6960;">集計週数</div>
      <div class="mono" style="font-size: 26px; font-weight: 500; line-height: 1.1;">8<span style="font-size: 12px; color: #a3a199; margin-left: 3px;">週</span></div>
    </div>
    <div style="flex-grow: 1; padding: 15px 20px; border-right: 1px solid #2c2c28; display: flex; flex-direction: column; gap: 2px;">
      <div class="mono" style="font-size: 9.5px; letter-spacing: 0.14em; color: #6b6960;">延べ掲載</div>
      <div class="mono" style="font-size: 26px; font-weight: 500; line-height: 1.1;">65<span style="font-size: 12px; color: #a3a199; margin-left: 3px;">件</span></div>
    </div>
    <div style="flex-grow: 1; padding: 15px 20px; display: flex; flex-direction: column; gap: 2px;">
      <div class="mono" style="font-size: 9.5px; letter-spacing: 0.14em; color: {{accent}};">急伸</div>
      <div class="mono" style="font-size: 26px; font-weight: 500; line-height: 1.1; color: {{accent}};">4<span style="font-size: 12px; color: #a3a199; margin-left: 3px;">技術</span></div>
    </div>
  </div>

  <div style="display: flex; gap: 6px; padding: 16px 20px; overflow: hidden;">
    <div class="mono" style="font-size: 12px; padding: 11px 16px; background: {{accent}}; color: #0d0d0c; font-weight: 600; white-space: nowrap;">優先度</div>
    <div class="mono" style="font-size: 12px; padding: 11px 16px; border: 1px solid #2c2c28; color: #a3a199; white-space: nowrap;">2軸マップ</div>
    <div class="mono" style="font-size: 12px; padding: 11px 16px; border: 1px solid #2c2c28; color: #a3a199; white-space: nowrap;">共起</div>
  </div>

  <div style="padding: 0 20px;">
    <div style="display: flex; flex-direction: column; gap: 1px; background: #2c2c28; border: 1px solid #2c2c28;">
      <sc-for list="{{rank}}" as="r" hint-placeholder-count="8">
        <div style="background: #161614; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; align-items: baseline; gap: 11px;">
            <span class="mono" style="font-size: 13px; color: {{r.rankColor}};">{{r.no}}</span>
            <span style="font-size: 15px; font-weight: 700;">{{r.name}}</span>
            <span class="mono" style="font-size: 15px; color: {{r.scoreColor}}; margin-left: auto;">{{r.score}}</span>
          </div>
          <div style="height: 8px; background: #1d1d1a;">
            <div style="height: 8px; width: {{r.pct}}; background: {{r.barColor}};"></div>
          </div>
          <div style="display: flex; gap: 14px;">
            <span class="mono" style="font-size: 11px; color: #6b6960;">直近4週 {{r.vol}} 件</span>
            <span class="mono" style="font-size: 11px; color: {{r.growColor}};">成長 {{r.grow}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 24px 20px 0;">
    <div class="mono" style="font-size: 10px; letter-spacing: 0.16em; color: {{accent}}; padding-bottom: 10px;">狙い目の束</div>
    <div style="background: #161614; border: 1px solid #2c2c28; border-left: 3px solid {{accent}}; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 13.5px; line-height: 1.85; color: #f2f1ea;">AIエージェントを扱う社内PJに入れば、LLM・PoC・生成AI・クラウドが同時に付いてくる。1本で4技術。</div>
      <div style="display: flex; flex-wrap: wrap; gap: 5px;">
        <span class="mono" style="font-size: 11.5px; background: #1d1d1a; border: 1px solid #2c2c28; padding: 3px 9px;">LLM (6)</span>
        <span class="mono" style="font-size: 11.5px; background: #1d1d1a; border: 1px solid #2c2c28; padding: 3px 9px;">PoC (6)</span>
        <span class="mono" style="font-size: 11.5px; background: #1d1d1a; border: 1px solid #2c2c28; padding: 3px 9px;">生成AI (6)</span>
        <span class="mono" style="font-size: 11.5px; background: #1d1d1a; border: 1px solid #2c2c28; padding: 3px 9px;">AWS (5)</span>
        <span class="mono" style="font-size: 11.5px; background: #1d1d1a; border: 1px solid #2c2c28; padding: 3px 9px;">Azure (5)</span>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#cdf24d","options":["#cdf24d","#5ad1c8","#f2a33c","#e5679a"]},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#cdf24d';
    const rank = [
      ['AIエージェント', 0.79, 8, '+700%'],
      ['DWH', 0.68, 7, '+600%'],
      ['SQL', 0.60, 11, '+267%'],
      ['AWS', 0.54, 13, '+160%'],
      ['Python', 0.49, 17, '+55%'],
      ['機械学習', 0.43, 12, '+100%'],
      ['MLOps', 0.37, 6, '+200%'],
      ['LLM', 0.34, 7, '+133%'],
    ].map((r, i) => ({
      no: String(i + 1).padStart(2, '0'),
      name: r[0], score: r[1].toFixed(2), vol: r[2], grow: r[3],
      pct: Math.round((r[1] / 0.79) * 100) + '%',
      rankColor: i < 4 ? accent : '#6b6960',
      barColor: i < 4 ? accent : '#3d4a2a',
      scoreColor: i < 4 ? accent : '#f2f1ea',
      growColor: i < 4 ? accent : '#a3a199',
    }));
    return { accent, rank };
  }
}
</script>
</body>
</html>
